# ---------------------------------------------------------------------------
# configs/ecg_config.yaml
#
# Pipeline 2 of 3: 12-lead ECG interpretation on PTB-XL.
# ---------------------------------------------------------------------------

modality: ecg
seed: 42
strict_determinism: false     # see paths.yaml for the speed/determinism note

dataset:
  name: ptbxl
  version: "1.0.3"
  # Root = the folder that directly contains ptbxl_database.csv, scp_statements.csv,
  # records100/ and records500/. Set CARDIOSENSE_DATA_ROOT and this resolves under it.
  root: data/ecg/ptbxl
  database_csv: ptbxl_database.csv
  scp_statements_csv: scp_statements.csv

  # --- Signal properties (fixed by the dataset, do not invent values) ------
  # PTB-XL ships every record at BOTH 100 Hz (records100/) and 500 Hz
  # (records500/). Each record is exactly 10 s, 12 leads.
  sampling_rate: 100          # 100 | 500
  signal_length: 1000         # = 10 s * sampling_rate. Must stay consistent.
  n_leads: 12
  lead_names: [I, II, III, aVR, aVL, aVF, V1, V2, V3, V4, V5, V6]
  # Why 100 Hz: 5x less I/O and memory (whole training set fits in Colab RAM as
  # float32, ~21.8k x 12 x 1000 x 4B ~= 1.0 GB), and the diagnostic superclass
  # task lives in morphology below 50 Hz. 500 Hz is left as a config switch for
  # a Phase 2 ablation.

task:
  # --- SELECTED TASK: 5-class diagnostic SUPERCLASS, MULTI-LABEL -----------
  # Classes come from scp_statements.csv `diagnostic_class`:
  #   NORM (normal), MI (myocardial infarction), STTC (ST/T change),
  #   CD (conduction disturbance), HYP (hypertrophy)
  # Multi-label because a single PTB-XL record legitimately carries more than
  # one diagnostic superclass; forcing single-label would silently discard
  # true positives and corrupt the metrics.
  name: diagnostic_superclass
  type: multilabel
  classes: [NORM, MI, STTC, CD, HYP]
  # Only SCP codes with a likelihood >= this value count as present. PTB-XL
  # stores likelihood 0-100 in scp_codes; 0 means "likelihood not stated" and
  # is treated as present, following the PTB-XL benchmarking convention.
  min_scp_likelihood: 0
  drop_records_without_label: true

split:
  # PTB-XL ships `strat_fold` (1-10): a stratified, PATIENT-DISJOINT 10-fold
  # assignment produced by the dataset authors. Using it gives a leakage-free
  # split for free AND makes results directly comparable to published work.
  # Never re-split randomly by record — the same patient appears many times.
  strategy: official_strat_fold
  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  val_folds: [9]
  test_folds: [10]

preprocessing:
  # Each step is justified in docs/datasets.md. Nothing is applied "because
  # everyone filters ECGs".
  remove_baseline_wander: true    # 0.5 Hz high-pass; removes respiration/electrode
                                  # drift that is not diagnostic and destabilises
                                  # per-lead normalisation
  highpass_hz: 0.5
  lowpass_hz: null                # PTB-XL is already band-limited; an extra
                                  # low-pass would attenuate QRS slopes. Off.
  notch_hz: null                  # powerline noise already handled upstream
  filter_order: 3                 # Butterworth, applied with filtfilt (zero-phase)
  normalization: per_lead_zscore  # per_lead_zscore | per_record_zscore | none
  clip_sigma: 8.0                 # guard against electrode-pop artefacts
  resample_to: null               # no resampling: we read the native 100 Hz files
  cache_npy: true
  cache_path: data/ecg/cache      # memmap-able .npy so Colab restarts are cheap

baseline:
  # Classical ML reference point: hand-crafted per-lead statistics + simple
  # morphology features -> one-vs-rest Logistic Regression.
  model: logistic_regression
  features: [mean, std, min, max, ptp, rms, skew, kurtosis,
             zero_crossing_rate, line_length, energy]
  max_iter: 1000
  class_weight: balanced

model:
  name: cnn1d                 # cnn1d | resnet1d
  cnn1d:
    in_channels: 12
    n_classes: 5
    channels: [32, 64, 128, 256]
    kernel_size: 7
    stride: 1
    pool_size: 2
    dropout: 0.3
    use_batchnorm: true
    global_pool: avgmax       # concat of global avg + max pooling
    fc_hidden: 128
  resnet1d:
    in_channels: 12
    n_classes: 5
    base_channels: 64
    blocks_per_stage: [2, 2, 2, 2]
    kernel_size: 7
    dropout: 0.2

training:
  epochs: 40
  batch_size: 128
  num_workers: 2              # Colab gives 2 vCPU on the free tier; >2 stalls
  pin_memory: true
  persistent_workers: true
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  loss: bce_with_logits       # correct loss for multi-label
  pos_weight: auto            # per-class positive weighting from train prevalence
  scheduler:
    name: reduce_on_plateau
    mode: max
    monitor: val_macro_auc
    factor: 0.5
    patience: 3
    min_lr: 0.000001
  early_stopping:
    monitor: val_macro_auc
    mode: max
    patience: 8
    min_delta: 0.0005
  amp: true                   # mixed precision; falls back silently on CPU
  grad_clip_norm: 5.0
  resume: true                # auto-resume from last.pt after a Colab disconnect
  checkpoint_every_epoch: true

evaluation:
  # Multi-label -> per-class ROC-AUC + average precision, macro/micro F1,
  # per-class confusion matrices. Plain multi-class accuracy is NOT reported:
  # it is mathematically inappropriate here (exact-match accuracy is reported
  # instead, clearly labelled).
  threshold_strategy: per_class_f1   # tuned on VALIDATION only
  default_threshold: 0.5
  bootstrap_ci: true
  n_bootstrap: 1000

explainability:
  method: integrated_gradients
  n_steps: 64
  baseline: zeros             # all-zero signal = "no deflection" reference
  n_examples: 8
  leads_to_plot: [I, II, V1, V2, V5]

output:
  models_dir: models/ecg
  results_dir: results/ecg
  model_file: ecg_model.pth
  config_file: ecg_config.json
  metadata_file: ecg_metadata.json
  model_version: ecg-v0.1.0
